---
layout: default
permalink: /76265/
title: 76265
nav: false
sitemap: false
---

<section class="poemlock" id="poemlock">
  <ul class="poemlock-index" id="poemlock-index">
    {% for p in site.data.poems_76265 %}
    <li><a href="#{{ p.slug }}">{{ p.title }}</a></li>
    {% endfor %}
  </ul>

  <div class="poemlock-locked" id="poemlock-locked" hidden>
    <a class="poemlock-back" href="#">← index</a>
    <p class="poemlock-which" id="poemlock-which"></p>
    <form class="poemlock-gate" id="poemlock-gate" autocomplete="off">
      <div class="poemlock-row">
        <input
          class="poemlock-input"
          id="poemlock-pw"
          type="password"
          name="poemlock-pw"
          placeholder="password"
          aria-label="password"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        >
        <button class="poemlock-btn" type="submit">open</button>
      </div>
      <p class="poemlock-msg" id="poemlock-msg" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="poemlock-content" id="poemlock-content" hidden>
    <a class="poemlock-back" href="#">← index</a>
    <div class="poemlock-view" id="poemlock-view"></div>
  </div>
</section>

<style>
  .poemlock {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 0 4rem;
  }
  .poemlock [hidden] {
    display: none !important;
  }

  /* directory */
  .poemlock-index {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .poemlock-index li {
    margin: 0 0 0.9rem;
  }
  .poemlock-index a {
    font-size: 1.05rem;
  }

  /* gate */
  .poemlock-gate {
    text-align: center;
  }
  .poemlock-which {
    margin: 2rem 0 1.5rem;
    text-align: center;
    font-size: 1.05rem;
  }
  .poemlock-row {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .poemlock-input {
    width: 220px;
    padding: 0.55rem 0.9rem;
    border: 1px solid var(--global-divider-color);
    border-radius: 8px;
    background: var(--global-bg-color);
    color: var(--global-text-color);
    font-size: 1rem;
  }
  .poemlock-input:focus {
    outline: none;
    border-color: var(--global-theme-color);
  }
  .poemlock-btn {
    padding: 0.55rem 1.25rem;
    border: 1px solid var(--global-divider-color);
    border-radius: 8px;
    background: transparent;
    color: var(--global-text-color);
    font-size: 1rem;
    cursor: pointer;
  }
  .poemlock-btn:hover {
    color: var(--global-theme-color);
    border-color: var(--global-theme-color);
  }
  .poemlock-msg {
    min-height: 1.4em;
    margin: 1rem 0 0;
    font-size: 0.9rem;
    opacity: 0.65;
  }

  /* poem */
  .poemlock-back {
    display: inline-block;
    margin: 0 0 1.75rem;
    font-size: 0.9rem;
    opacity: 0.7;
  }
  .poemlock-view h1 {
    margin: 0 0 2rem;
    font-size: 1.25rem;
    font-weight: 500;
  }
  .poemlock-view p {
    margin: 0 0 1.5rem;
    font-size: 1.05rem;
    line-height: 1.8;
  }
  .poemlock-view p:last-child {
    margin-bottom: 0;
  }
</style>

<script>
  (function () {
    var PAYLOAD_BASE = "{{ '/assets/enc/' | relative_url }}";
    var PW_KEY = "poems76265_pw";

    var index = document.getElementById("poemlock-index");
    var locked = document.getElementById("poemlock-locked");
    var which = document.getElementById("poemlock-which");
    var gate = document.getElementById("poemlock-gate");
    var pw = document.getElementById("poemlock-pw");
    var msg = document.getElementById("poemlock-msg");
    var content = document.getElementById("poemlock-content");
    var view = document.getElementById("poemlock-view");

    var titles = {};
    [].slice.call(index.querySelectorAll("a")).forEach(function (a) {
      titles[a.getAttribute("href").slice(1)] = a.textContent;
    });

    var current = null;
    var cache = {};
    var payloads = {};

    function b64(s) {
      return Uint8Array.from(atob(s), function (c) {
        return c.charCodeAt(0);
      });
    }

    function getPayload(slug) {
      if (payloads[slug]) return Promise.resolve(payloads[slug]);
      return fetch(PAYLOAD_BASE + "76265-" + slug + ".json")
        .then(function (r) {
          return r.json();
        })
        .then(function (p) {
          payloads[slug] = p;
          return p;
        });
    }

    function decrypt(slug, password) {
      return getPayload(slug).then(function (p) {
        var subtle = window.crypto.subtle;
        return subtle
          .importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"])
          .then(function (km) {
            return subtle.deriveKey(
              { name: "PBKDF2", salt: b64(p.salt), iterations: p.iter, hash: "SHA-256" },
              km,
              { name: "AES-GCM", length: 256 },
              false,
              ["decrypt"]
            );
          })
          .then(function (key) {
            return subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.ct));
          })
          .then(function (buf) {
            return JSON.parse(new TextDecoder().decode(buf));
          });
      });
    }

    function unlock(slug, password) {
      return decrypt(slug, password).then(function (d) {
        cache[slug] = d.html;
      });
    }

    function storedPw() {
      try {
        return sessionStorage.getItem(PW_KEY);
      } catch (e) {
        return null;
      }
    }

    function storePw(v) {
      try {
        sessionStorage.setItem(PW_KEY, v);
      } catch (e) {}
    }

    function showIndex() {
      index.hidden = false;
      locked.hidden = true;
      content.hidden = true;
    }

    function showGate(slug) {
      index.hidden = true;
      content.hidden = true;
      which.textContent = titles[slug];
      msg.textContent = "";
      pw.value = "";
      locked.hidden = false;
      pw.focus();
    }

    function showPoem(slug) {
      view.innerHTML = cache[slug];
      index.hidden = true;
      locked.hidden = true;
      content.hidden = false;
    }

    function route() {
      var slug = location.hash.replace(/^#/, "");
      if (!slug || !(slug in titles)) {
        current = null;
        showIndex();
        return;
      }
      current = slug;
      if (cache[slug]) {
        showPoem(slug);
        return;
      }
      showGate(slug);
      var saved = storedPw();
      if (saved && window.crypto && window.crypto.subtle) {
        msg.textContent = "unlocking…";
        unlock(slug, saved).then(
          function () {
            if (current === slug) showPoem(slug);
          },
          function () {
            if (current === slug) msg.textContent = "";
          }
        );
      }
    }

    gate.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!window.crypto || !window.crypto.subtle) {
        msg.textContent = "this browser can't decrypt here — try https.";
        return;
      }
      var slug = current;
      var entered = pw.value;
      msg.textContent = "unlocking…";
      unlock(slug, entered).then(
        function () {
          storePw(entered);
          if (current === slug) showPoem(slug);
        },
        function () {
          msg.textContent = "not it.";
          pw.select();
        }
      );
    });

    window.addEventListener("hashchange", route);
    route();
  })();
</script>
