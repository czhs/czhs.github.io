  - num: 5
    slug: "kpf9zriu"
    evt: "evt-Ldd7152eF3yPzrb"
    date: "2026-06-15"
    title: "A Mathematical Framework for Transformer Circuits"
    cover: "https://images.lumacdn.com/gallery-images/87/0b766ae1-14a6-4eae-925f-75e0515c671f.png"
    summary: "What does it mean to “fully understand” a model — and is a one-layer transformer just a lookup table? If the residual stream is only a communication channel, where does the computation actually live?"
    description: |-
      This is a founding document of transformer mechanistic interpretability. The authors rewrite attention-only transformers in a mathematically equivalent form where the weights become directly readable: the residual stream is a passive communication channel, each head is an independent additive unit, and every head splits into a QK circuit (where to attend) and an OV circuit (what to write). Under this lens, a one-layer model is just an ensemble of bigram and “skip-trigram” tables — bugs included.

      The payoff comes at two layers, where heads compose through the residual stream: K-composition with a previous-token head produces induction heads, which find earlier occurrences of the current token and copy what came next — a real in-context algorithm rather than a lookup table, and the paper’s candidate mechanism for in-context learning in large models.

      Discussion at 8 pm, (optional) quiet reading from 7 pm.
    reading:
      - title: "A Mathematical Framework for Transformer Circuits — Elhage, Nanda, Olsson, et al. (Anthropic)"
        url: "https://transformer-circuits.pub/2021/framework/index.html"
