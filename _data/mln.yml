    title: "Fundamental Limitations of Single-Vector Embeddings"
    cover: "https://images.lumacdn.com/gallery-images/s0/94a98dc7-f16e-4e74-b733-4b62747a738d.png"
    summary: "Why does something as simple as “finding people who like apples” break our best models? What do alternatives like multi-vector models or cross-encoders mean for real products?"
    description: |-
      Why does something as simple as “finding people who like apples” break our best models? What do alternatives like multi-vector models or cross-encoders mean for real products?

      This research establishes a fundamental mathematical constraint in dense retrieval: embedding models cannot represent all possible top-k combinations of relevant documents simultaneously. Weller et al. demonstrate this through both theory and a clever benchmark (LIMIT) where even advanced state-of-the-art models struggle with trivially simple queries, suggesting important implications for instruction-following retrieval systems.

      Join us at CASI for discussion at 8 pm, and (optional) quiet reading from 7 pm.
    reading:
      - title: "On the Theoretical Limitations of Embedding-Based Retrieval — Weller et al."
        url: "https://arxiv.org/abs/2508.21038"
  - num: 13
    slug: "5wvhx171"
    evt: "evt-r6zcq5sAFOwiOEh"
    date: "2026-08-31"
    title: "Manifold-Constrained Hyper-Connections"
    cover: "https://images.lumacdn.com/gallery-images/wx/3b0a8406-85d0-426f-a10d-f00084982b88.png"
    summary: "How does constraining residual connections to a geometric manifold restore identity mappings and enable stable scaling in large language models? Can richer cross-layer connectivity improve reasoning and representation quality without sacrificing optimization stability?"
    description: |-
      How does constraining residual connections to a geometric manifold restore identity mappings and enable stable scaling in large language models? Can richer cross-layer connectivity improve reasoning and representation quality without sacrificing optimization stability?

      DeepSeek’s Manifold-Constrained Hyper-Connections (mHC) introduce a principled fix to recent attempts at widening residual streams. While Hyper-Connections improve performance by allowing richer cross-layer mixing, their unconstrained residual matrices break the identity-mapping property that makes deep networks trainable, leading to severe instability at scale. mHC resolves this by projecting residual mixing matrices onto the manifold of doubly stochastic matrices, ensuring residual updates remain convex combinations of features and preserving signal magnitude across depth.

      Empirically, this constraint dramatically stabilizes training in large language models, eliminating gradient explosions observed in unconstrained HC while retaining its performance gains. With careful systems co-design—kernel fusion, recomputation, and pipeline overlap—mHC incurs only ~6–7% overhead at 27B scale, while consistently improving downstream reasoning benchmarks. The result reframes architectural scaling as a geometric constraint problem, showing that richer connectivity can be safely exploited when paired with mathematically grounded structure rather than ad-hoc regularization.

      Join us at CASI for discussion at 8 pm, and (optional) quiet reading from 7 pm.
    reading:
      - title: "mHC: Manifold-Constrained Hyper-Connections — DeepSeek"
        url: "https://www.arxiv.org/pdf/2512.24880"
  - num: 14
    slug: "srsz8rga"
    evt: "evt-v89wbXHXDCt5bik"
    date: "2026-09-07"
    title: "Attention Residuals: Rethinking Information Flow in LLMs"
    cover: "https://images.lumacdn.com/gallery-images/l6/26a28b85-5c4f-4d9a-a09a-e401c29ce330.png"
    summary: "Standard residual connections with PreNorm accumulate every layer’s output with fixed unit weights, letting the hidden state grow uncontrollably with depth and diluting each layer’s unique contribution — what if each layer could instead learn which earlier representations to read from?"
    description: |-
      Standard residual connections with PreNorm accumulate every layer’s output with fixed unit weights, letting the hidden state grow uncontrollably with depth and diluting each layer’s unique contribution — what if each layer could instead learn which earlier representations to read from?

      This paper introduces Attention Residuals (AttnRes), a novel architectural mechanism by the Kimi Team designed to rethink how information flows in modern Large Language Models. The central challenge is that standard residual connections with PreNorm accumulate all layer outputs using fixed unit weights; this uniform aggregation causes uncontrolled hidden-state growth with depth, progressively diluting each layer’s unique contribution.

      To overcome this limitation, the authors replace the fixed accumulation with a softmax attention mechanism over preceding layer outputs, allowing each layer to selectively aggregate earlier representations using learned, input-dependent weights.

      Join us at CASI for discussion at 8 pm, and (optional) quiet reading from 7 pm.
    reading:
      - title: "Attention Residuals: Rethinking Information Flow in LLMs — Kimi Team"
        url: "https://arxiv.org/pdf/2603.15031"
