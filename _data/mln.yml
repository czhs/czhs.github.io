    tags: ["board notes"]
    title: "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics"
    cover: "https://images.lumacdn.com/gallery-images/i5/07dddbd8-1b4d-4a2e-98d2-e3bb0df54045.png"
    summary: "LeJEPA pushes in the opposite direction: instead of stabilizing training with heuristics, it builds a system where the objective itself prevents collapse."
    description: |-
      Most self-supervised learning methods work by carefully balancing instability. Remove stop-gradients, momentum encoders, or augmentation tricks, and they collapse. We’ve gotten strong results, but not a clean understanding of why they work. LeJEPA pushes in the opposite direction: instead of stabilizing training with heuristics, it builds a system where the objective itself prevents collapse.

      The core idea is simple but sharp: learn representations by predicting latent structure across views, while designing the objective so that trivial solutions (e.g., constant embeddings) are provably suboptimal. This removes the need for asymmetric updates used in methods like BYOL or contrastive negatives from SimCLR.

      Discussion at 20:00, (optional) quiet reading from 19:00.
    reading:
      - title: "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics"
        url: "https://arxiv.org/pdf/2511.08544"
