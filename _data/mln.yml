    title: "Touching the Elephant — TPUs"
    cover: "https://images.lumacdn.com/uploads/qe/e05f54e2-b550-486e-84b6-c40691c4b6d9.png"
    summary: "What if the real moat in AI isn’t the model, but the chip? Should AI run on custom silicon or general-purpose chips?"
    description: |-
      What if the real moat in AI isn’t the model, but the chip? Should AI run on custom silicon or general-purpose chips?

      This article is a deep dive into the history and architecture of Google’s Tensor Processing Units (TPUs) — custom silicon that now powers the world’s most advanced AI models. Reed Oliver traces how Google moved away from general-purpose chips to build dedicated, “monastic” hardware optimised for one thing: matrix multiplication at scale.

      The piece explores why Google made the bet on custom hardware when GPUs were already dominant, what makes TPUs architecturally different, and how that decision reshaped the broader AI industry — from training costs to the competitive landscape.

      Discussion at 8 pm, (optional) quiet reading from 7 pm.
