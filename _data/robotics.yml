# Standalone robotics portfolio (/robotics/) — single source of truth.
# This micro-site links BACK to the personal site, but the personal site never links to it.
# Add a project: append to `projects` and create _pages/robotics_<slug>.md (layout: robotics_post).
name: Chris Shi
url: /robotics/
site_label: Robotics
subtitle: Math and computer engineering at Carnegie Mellon University.
# Production builds serve every media path below from this GitHub release
# (basename only), so the bytes never enter git — the MLn paper-audio trick.
# Locally the same paths serve straight from the gitignored assets dirs.
# Upload: gh release upload robotics-media <files>
media_base: "https://github.com/czhs/czhs.github.io/releases/download/robotics-media/"
# Verbatim from the main site (_pages/about.md), trimmed to the two sentences
# that apply here. Do not reword — see docs/claude/content-rules.md.
about: >-
  I'm fascinated by the hardware of thinking. For fun, I work on animating robots
  (<a href="https://thewaltdisneycompany.com/news/behind-the-bdx-droids/"
  target="_blank" rel="noopener">like these</a>).
# Assembled from real phrases on this site: the duck blurb ("bare servos"),
# the pie specs ("self-designed 3D-printed mounts"), the gantry page
# (steppers/breadboard), the TartanIMU page ("learned inertial odometry",
# AirLab), and MLn paper titles (Transformer Circuits, Towards Monosemanticity,
# Inside vLLM, Goedel-Prover). Chris's to reword.
about2: >-
  The projects here start at bare servos — soldering, wiring, self-designed
  3D-printed mounts, steppers on a breadboard — and run up to learned inertial
  odometry in the AirLab at Carnegie Mellon. Every week I also read ML papers
  with a reading group: lately transformer circuits, monosemanticity, the
  anatomy of vLLM, and formal theorem proving.
under_construction: false
# Sidebar links (bottom of the left column). External links open in a new tab.
links:
  - { label: Personal Website, url: / } # the one link back to the main site
  - { label: LinkedIn, url: "https://www.linkedin.com/in/chris-h-shi" }
  - { label: GitHub, url: "https://github.com/czhs" }
  - { label: CV, url: /cv/ }
  - { label: Email, url: "mailto:chrisshi@andrew.cmu.edu" }

