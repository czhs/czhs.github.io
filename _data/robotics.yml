    # it is deliberately absent from `media`.
    cover: assets/img/robotics/tartanimu.jpg
    links:
      - { label: HuggingFace Demo, url: "https://huggingface.co/spaces/HongyiShi/TartanIMU-Demo" }
    media:
      - image: assets/img/robotics/tartanimu-imu.jpg
        caption: "The other half of the demo's output: the accelerometer and gyroscope stream the model is given."
        wide: true
      # From Chris's OWN visualizer (~/Desktop/visualization on tp64), generated
      # by his visualize_npz.py on Helmet_Poser_Aligned/A_c (40,244 samples,
      # 201.2s). Not a screenshot of anyone else's tool. The companion
      # visualize_live.py is a Foxglove-style 3D web viewer; it only serves a
      # live UI and can export a self-contained HTML, so it produces no video.
      - image: assets/img/robotics/tartanimu-viz-dashboard.jpg
        caption: "One processed HelmetPoser sequence — 40,244 samples, 201.2 seconds — in the npz dashboard. The last panel is the built-in gravity check: accelerometer magnitude against a dashed line at 9.81."
        wide: true
      - image: assets/img/robotics/tartanimu-viz-traj.jpg
        caption: "The same sequence top-down, coloured by time."

