  - slug: tartanimu
    title: TartanIMU
    blurb: >-
      Inertial odometry: a trajectory estimated from IMU alone, with a live demo on Hugging Face.
    date: "Oct 2025 – May 2026"
    # Figures are real output from the demo's own model + bundled example
    # (LIN_ios_2022-01-19), run on the 4090 because the Space is on free-tier
    # CPU. ATE 1.4684 m, translational RTE 0.2044 m, inference 0.35 s.
    # tartanimu-traj.jpg is the page's lead figure, placed by
    # _pages/robotics_tartanimu.md itself (same pattern as the gantry hero), so
    # it is deliberately absent from `media`.
    cover: assets/img/robotics/tartanimu.jpg
    links:
      - { label: HuggingFace Demo, url: "https://huggingface.co/spaces/HongyiShi/TartanIMU-Demo" }
    media:
      - image: assets/img/robotics/tartanimu-imu.jpg
