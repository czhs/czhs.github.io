#           each entry is {video, poster} or {image}, plus caption and optional wide: true
#   date    term/year on the card and detail page — LEFT BLANK ON PURPOSE, fill these in
#   links   optional row of buttons on the detail page, e.g.
#             links:
#               - { label: Code, url: "https://github.com/..." }
