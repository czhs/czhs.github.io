  - slug: pie-robot
    title: Pi Day Pie Robot
    blurb: >-
      A borrowed microwave, a printed arm, and a great deal of orange tape.
    date: "Spring 2026"
    # Gated b-roll at the bottom of the post. Ciphertext only in the repo; the
    # password is never written here (public repo). Re-encrypt with:
    #   python3 bin/research_lock.py pie-broll <password> <plain.html> assets/enc/robotics-pie-broll.json
    broll_title: "B-roll"
    broll_enc: /assets/enc/robotics-pie-broll.json
    # Hero is the two-part door open — the signature move. Card still (2026-09-16,
    # "get a better cover for the ... pi bot"): the arm reaching into the open
    # microwave with the cup on the turntable — robotics_media/Pie Day Bot/
    # IMG_9022.MOV at 227.71 s, upright, crop=1080:810:0:520, scaled to 1200x900.
    cover: assets/img/robotics/pie-robot-card.jpg
    poster: assets/img/robotics/pie-robot-poster.jpg
    video: assets/video/robotics/pie-open.mp4
    tagline: "A borrowed microwave, a printed arm, and a great deal of orange tape."
    intro: >-
      A Pi Day hackathon sprint. Each cup is a pie assembled ahead of time — a crumb
      base of crushed crackers under pumpkin pie filling — so it only needs heating.
      Everything after that is the robot's job: the door, the cup, the start button,
      and the whipped cream on top.
    specs:
      - Pi Day hackathon
      - ESP32
      - Self-designed 3D-printed mounts
      - Servo actuation
      - Two-stage door open
    # Chris's build notes. Facts are his; do not embellish them.
    build_notes: >-
      The microwave is stock hardware with no electrical interface, so every input
      had to be made mechanically. Servos driven by an ESP32 work the door and the
      start button, and every bracket holding them — along with the fixture that
      clamps the whipped cream can upside down above the plate — is self-designed
      and 3D printed. The first door mechanism was a geared motor turning a printed
      spur gear against the door; it never produced the torque needed to break the
      latch, and that assembly is still taped to the top of the machine in the
      footage, no longer turning. What replaced it is the two-move open in step one:
      pull the handle until the latch pops, then push a clear acrylic bar taped
      upright along the door's top edge. The bar is a lever, and it buys back the
      reach and leverage a short arm does not have.
    # The path. This is the robot's actual routine in order, so the sequence is
    # information: each station is a step, and the rail fills as the run plays.
    # `branch: true` hangs a station off the previous one as a dashed detour.
    run:
      - label: Open
        note: two moves
        video: assets/video/robotics/pie-open.mp4
        poster: assets/img/robotics/pie-robot-poster.jpg
        desc: "The gripper pulls the handle until the latch pops, then reaches up and shoves the acrylic bar taped to the top of the door. The arm is too short to swing the door itself, so the door was given a longer handle."
        tech: "Two actuations, because one will not do. The latch needs a sharp pull right at the door's edge; the swing needs leverage from a point the arm cannot physically reach. The first attempt was a geared motor driving a printed spur gear, which never broke the latch, so the problem was moved from torque to geometry by fixing a rigid bar to the door and pushing that instead."
      - label: Load
        note: cup in
        video: assets/video/robotics/pie-cup-in.mp4
        poster: assets/img/robotics/pie-cup-in-poster.jpg
        desc: "Cup off the top of the microwave and onto the turntable."
        tech: "A paper cup is an awkward payload: the gripper has to close hard enough to carry it and not hard enough to crumple it. The place is the harder half, since the cup has to go through a door opening and land flat on a turntable with the arm working near full extension."
      - label: Close
        note: door shut
        video: assets/video/robotics/pie-door-close.mp4
        poster: assets/img/robotics/pie-door-close-poster.jpg
        desc: "The arm rises to near-vertical, reaches the top of the open door and pushes it until the latch catches."
        tech: "The same lever driven the other way. A latch only catches if the push lands near the door's free edge, so the arm has to reach past the hinge side rather than shove the middle of the door, where the force would just flex it."
      - label: Retry
        note: the tape gave up
        branch: true
        video: assets/video/robotics/pie-door-fail.mp4
        poster: assets/img/robotics/pie-door-fail-poster.jpg
        desc: "The same close, twenty-three seconds earlier. The door swings almost shut, rebounds, and the tape holding the acrylic bar peels off. Someone re-tapes it and the next attempt holds."
        tech: "Worth showing because the failure is a fixturing problem, not a control one. The tape holding the lever peeled under repeated load and the bar slid down the door. The trajectory was fine; the mount was not, which is the failure mode you actually get on a hackathon timeline."
      - label: Start
        note: servo
        video: assets/video/robotics/pie-servo-start.mp4
        poster: assets/img/robotics/pie-servo-start-poster.jpg
        desc: "A servo on a printed bracket presses the panel."
        tech: "The microwave has no electrical interface and was never going to be rewired, so pressing start stays a mechanical problem: an ESP32-driven servo on a printed bracket has to land on one membrane button, repeatably, from a fixed mount."
      - label: Unload
        note: cup out
        video: assets/video/robotics/pie-cup-out.mp4
        poster: assets/img/robotics/pie-cup-out-poster.jpg
        desc: "Back out and onto the paper plate, which is parked under the nozzle for a reason."
        tech: "The pick is routine; the placement is the point. The cup has to come to rest under the dispenser nozzle, so this step's tolerance decides whether the next step can work at all."
      - label: Top
        note: whipped cream
        video: assets/video/robotics/pie-cream.mp4
        poster: assets/img/robotics/pie-cream-poster.jpg
        desc: "The reason. The gripper tips the lever on an upside-down can and the cup fills from empty."
        tech: "Actuating a consumer aerosol valve with a robot gripper. The can is clamped inverted in a printed fixture so it will dispense at all, and the lever needs a steady push held for about a second rather than a tap."
    media:
      # Everything here sits OUTSIDE the run — the path above already shows the
      # routine, so repeating those clips down here would just be the same footage
      # twice.
      - video: assets/video/robotics/pie-training-data.mp4
        poster: assets/img/robotics/pie-training-data-poster.jpg
        caption: "Collecting training data: walking the arm through the motion by hand, repeatedly, so it can do it on its own."
      # Bench-cam stills from the same Pi Day session, sitting with the training
      # clip they came from. Source: 2026-03-14 01-56-27.mp4 on tp64 at 0:50 and
      # 1:30 — pillarboxed and 90 deg CCW, so rotated CW and cropped. Only two:
      # the 0:57 frame was the same hand-over-a-closed-microwave shot as 0:50.
      - image: assets/img/robotics/pie-training-1.jpg
        caption: ""
      - image: assets/img/robotics/pie-training-3.jpg
        caption: ""
      - video: assets/video/robotics/pie-full-run.mp4
        poster: assets/img/robotics/pie-full-run-poster.jpg
        caption: "The last stretch of one session, uncut."

