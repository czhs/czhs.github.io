# ringworld — a weekly maker space; a Socratica node.
#
# STATIC-LANDING MODE (2026-08-20): /ringworld/ is a plain landing page for now
# — no Luma links, no sessions strip, no blog. The machinery below (calendar_url,
# share_note, sessions) is parked, not deleted, so the full site can come back.
#
# Every card on /ringworld/ and every /ringworld/session-N/ page is rendered
# from this file. Sync is manual — pull the current state from
# https://luma.com/ringworld.
#
# To add a session: copy a block, bump `num`, paste the Luma slug + evt id, and
# add a matching stub page in _pages/rw_sessionN.md.
#   slug   — the luma.com/<slug> path for the event
#   evt    — the evt-… id used by the lu.ma/embed/event/<evt>/simple iframe
#   photo  — optional. A photo from that session, put in
#            assets/img/ringworld/sessions/. Giving a session a photo turns its
#            card into a flip card: character on the front, photo on the back,
#            revealed on hover. Add `photo_alt` to describe it. Sessions with no
#            photo just don't flip.
#   sprite — the session's character, a filename (no extension) from
#            assets/img/ringworld/sprites/. Give each session a different one;
#            it is what tells the cards apart. Defaults to `ringworld`.
#            Available: alien-green astronaut blob-blue blob-green blob-lilac
#            blob-peach cloud-blue cloud-mint cloud-purple comet comet-peach
#            constellation crystal frog jellyfish moon ringworld rock-grey
#            rocket saturn-orange saturn-peach saturn-purple star-big
#            star-folded star-ringed star-trail stars-twin ufo-alien ufo-bear
#            ufo-blue ufo-eye
# Sitewide banner under the masthead. Set to true to bring it back; the strip
# itself still lives in _layouts/ringworld_base.liquid.
under_construction: false

calendar_url: https://luma.com/ringworld
time: 4–7pm
location: CUC Fishbowl, 3rd Floor
location_note: ""
# The network the club belongs to. Linked from the About panel and the footer.
socratica_url: https://www.socratica.info/
# How someone gets a post onto the blog. Posts are added by hand — see
# _ringworld/example-post.md for the template.
share_note: send it to us on Luma and it goes up.
# The club blurb. Used as the hero lead and as the page description meta, so it
# only needs changing here.
blurb: >-
  A friendly community of tinkerers in Pittsburgh, PA—we meet every Sunday near
  CMU to work on the things we don't normally have time for.

sessions:
  - num: 1
    slug: "kduzb3gz"
    evt: "evt-7loVUQIHc8aBiIk"
    date: "2026-08-30"
    sprite: ringworld
    # Title and description are pulled verbatim from the Luma event.
    title: "ringworld"
    description: |-
      Welcome to ringworld!

      The project you work on can be anything! ex. building a robot, writing a poem,
      coding an app, making beats, painting shoes — as long as it's something you're not
      obligated to do (i.e. no school work if you're a student, no job work if you're
      employed).

      At the end, we have a show-and-tell option for people to talk about what they did.
