  (function () {
    var PAYLOAD_URL = "/assets/enc/research-ih-engineering-notebook-2026-08-15.json";
    var STORE_KEY = "research_pw";

    var gate = document.getElementById("rlock-gate");
    var pw = document.getElementById("rlock-pw");
    var msg = document.getElementById("rlock-msg");
    var content = document.getElementById("rlock-content");

    function b64(s) {
      return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
    }

    var payload = null;
    function getPayload() {
      if (payload) return Promise.resolve(payload);
      return fetch(PAYLOAD_URL)
        .then(function (r) { return r.json(); })
        .then(function (p) { payload = p; return p; });
    }

    function decrypt(password) {
      return getPayload().then(function (p) {
        var subtle = window.crypto.subtle;
        return subtle
          .importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"])
          .then(function (km) {
            return subtle.deriveKey(
              { name: "PBKDF2", salt: b64(p.salt), iterations: p.iter, hash: "SHA-256" },
              km,
              { name: "AES-GCM", length: 256 },
              false,
              ["decrypt"]
            );
          })
          .then(function (key) {
            return subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.ct));
          })
          .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
      });
    }

    function unlock(password, remember) {
      return decrypt(password).then(function (data) {
        content.innerHTML = data.html;
        gate.hidden = true;
        content.hidden = false;
        if (remember) {
          try { sessionStorage.setItem(STORE_KEY, password); } catch (e) {}
        }
      });
    }

    gate.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!window.crypto || !window.crypto.subtle) {
        msg.textContent = "this browser can't decrypt here — try https.";
        return;
      }
      msg.textContent = "unlocking…";
      unlock(pw.value, true).catch(function () {
        msg.textContent = "not it.";
        pw.select();
      });
    });

    try {
      var saved = sessionStorage.getItem(STORE_KEY);
      if (saved && window.crypto && window.crypto.subtle) {
        unlock(saved, false).catch(function () {});
      }
    } catch (e) {}
  })();
